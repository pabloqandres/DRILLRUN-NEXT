name: V74 catalogue navigation consistency M1-M5
on:
  push:
    branches: [chatgpt/v74-catalog-all-categories-navigation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  catalog-eight-categories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: |
          node --check dist/chapter/catalog-view.mjs
          node --check dist/chapter/construction-catalog.mjs
      - run: |
          node --test tests/v74-catalog-navigation-consistency.test.mjs tests/v71-m2-layout-galpon.test.mjs tests/wave01-catalog-rollback-v58.test.mjs
