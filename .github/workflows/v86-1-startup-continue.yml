name: "V86.1 startup and cloud Continue hotfix"
on:
  push:
    branches: [chatgpt/v86-1-hotfix-continue-cloud-bootstrap]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  startup-resume-v86-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Ensure removed HUD control cannot crash startup
        run: |
          node --check dist/chapter/game.mjs
          node --test tests/v86-1-startup-continue.test.mjs tests/v86-premium-radial-rescue-personnel.test.mjs tests/v82-faena-command-center.test.mjs tests/v81-personnel-no-jitter.test.mjs
