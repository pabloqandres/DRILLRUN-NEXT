name: "V91 · Financial history is read-only"
on:
  push:
    branches: [chatgpt/v91-financial-history]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  finance-v91:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Financial ledger purity and core regressions
        run: |
          node --check dist/chapter/finance-ledger-v91.mjs
          node --check dist/chapter/finance-view-v91.mjs
          node --check dist/chapter/faena-center.mjs
          node --check dist/chapter/game.mjs
          node --test tests/v91-financial-history.test.mjs tests/v90-radial-command-wheel.test.mjs tests/v86-1-startup-continue.test.mjs tests/v82-faena-command-center.test.mjs
