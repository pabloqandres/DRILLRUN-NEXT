name: V54 DrillTruck steering and driving icons
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  v54:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax
        run: |
          node --check dist/chapter/game.mjs
          node --check dist/chapter/icons.mjs
          node --check dist/mission5/personal-drilltruck.mjs
          node --check tests/v54-drilltruck-steering-controls.test.mjs
      - name: Vehicle + night lighting + mission regressions
        run: node --test tests/v54-drilltruck-steering-controls.test.mjs tests/v50-personal-drilltruck-driving.test.mjs tests/v52-night-patio-driving.test.mjs tests/v53-faena-and-recovery.test.mjs tests/m5-stepwise-checklist-reward-v46.test.mjs
