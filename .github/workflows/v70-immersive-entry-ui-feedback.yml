name: V70 fullscreen entry and restrained UI sound
on:
  push:
    branches: [chatgpt/v70-immersive-entry-ui-feedback]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  v70-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check dist/chapter/game.mjs
          node --check dist/chapter/immersive-entry-v70.mjs
          node --check dist/audio/character-select-feedback-v68.mjs
      - name: Fullscreen and previous user-flow regressions
        run: |
          node --test tests/v70-immersive-entry-sound.test.mjs tests/v69-direct-entry-npc-skill-portrait.test.mjs tests/v68-cinematic-character-selector.test.mjs tests/v64-cinematic-welcome-flow.test.mjs
