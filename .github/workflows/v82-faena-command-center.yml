name: "V82 Faena: cinematic assets and live routed overview"
on:
  push:
    branches: [chatgpt/v82-faena-command-center]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  faena-v82:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax and targeted regressions
        run: |
          node --check dist/chapter/faena-center.mjs
          node --test tests/v82-faena-command-center.test.mjs tests/v53-faena-and-recovery.test.mjs tests/v81-personnel-no-jitter.test.mjs
