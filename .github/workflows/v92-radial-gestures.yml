name: "V92 · touch radial interaction and finish"
on:
  push:
    branches: [chatgpt/v92-radial-touch-finish]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  radial-touch-v92:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288ca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Touch gestures, focus, sound and startup regression checks
        run: |
          node --check dist/chapter/semi-radial-dock-v90.mjs
          node --check dist/chapter/game.mjs
          node --test tests/v92-radial-gestures.test.mjs tests/v90-radial-command-wheel.test.mjs tests/v91-financial-history.test.mjs tests/v86-1-startup-continue.test.mjs tests/v82-faena-command-center.test.mjs
