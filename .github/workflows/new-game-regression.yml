name: New game regression checks
on:
  push:
    branches: ['chatgpt/new-game-stability-fixes', main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/new-game-stability.test.mjs
      - run: npm test
