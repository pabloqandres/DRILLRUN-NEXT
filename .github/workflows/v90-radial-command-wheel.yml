name: "V90 · Professional radial command wheel"
on:
  push:
    branches: [chatgpt/v90-radial-command-wheel]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  radial-v90:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax, polar wheel, navigation, and Google/Personnel regressions
        run: |
          node --check dist/chapter/semi-radial-dock-v90.mjs
          node --check dist/chapter/game.mjs
          node --test tests/v90-radial-command-wheel.test.mjs tests/v86-1-startup-continue.test.mjs tests/v87-classic-brand.test.mjs tests/v81-personnel-no-jitter.test.mjs tests/v82-faena-command-center.test.mjs
