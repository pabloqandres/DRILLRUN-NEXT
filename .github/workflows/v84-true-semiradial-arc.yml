name: "V84 · Real curved semi-radial geometry"
on:
  push:
    branches: [chatgpt/v84-true-semiradial-arc]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  true-arc-v84:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax and gameplay UI regression
        run: |
          node --check dist/chapter/semi-radial-dock-v83.mjs
          node --check dist/chapter/game.mjs
          node --test tests/v84-true-semiradial-arc.test.mjs tests/v83-semiradial-dock.test.mjs tests/v82-faena-command-center.test.mjs tests/v81-personnel-no-jitter.test.mjs
