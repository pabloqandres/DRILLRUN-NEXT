name: "V81 Personnel: no redraw, complete detail, pictograms"
on:
  push:
    branches: [chatgpt/v81-personnel-no-jitter-compact-ui]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  personnel-v81:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax and Personnel regressions
        run: |
          node --check dist/chapter/personnel-premium-v76.mjs
          node --check dist/chapter/faena-center.mjs
          node --test tests/v81-personnel-no-jitter.test.mjs tests/v80-personnel-visual-redesign.test.mjs tests/v79-personnel-career-payroll.test.mjs tests/v78-personnel-admin-portraits.test.mjs tests/v77-personnel-placeholders.test.mjs tests/v76-personnel-premium.test.mjs
