name: V76 Personnel: 21 NPC identities, skills and compact UI
on:
  push:
    branches: [chatgpt/v76-personal-roster-premium]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  personnel-v76:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check dist/chapter/personnel-candidates-v76.mjs
          node --check dist/chapter/personnel-premium-v76.mjs
          node --check dist/chapter/faena-center.mjs
          node --check dist/chapter/game.mjs
          node --check dist/mission3/personnel.mjs
          node --check dist/mission5/patio-staff.mjs
          node --check dist/audio/character-select-feedback-v68.mjs
      - name: Candidate images, hiring, career data and regressions
        run: |
          node --test tests/v76-personnel-premium.test.mjs tests/v75-personnel-outside-catalog.test.mjs tests/v70-immersive-entry-sound.test.mjs tests/v73-workshop-build-m3-sms.test.mjs
