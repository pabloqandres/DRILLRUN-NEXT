#playHero{position:absolute;top:80.5%;left:37.6%;width:24.8%;height:8.5%;border:0;padding:0;background:transparent;transform:translateZ(0);z-index:20;touch-action:manipulation}
#playHero::before{content:'';position:absolute;inset:-5%;background:linear-gradient(105deg,#c92848 0%,#e34055 42%,#dd3046 62%,#9b2438 100%);clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%);opacity:0;filter:blur(5px);transition:opacity .22s}
#playHero:hover::before,#playHero:focus-visible::before{opacity:.19}
#playHero:active{transform:scale(.975)}
#playHero .pulse{position:absolute;inset:-22%;border:1px solid rgba(255,92,105,.28);border-radius:48%;filter:blur(13px);animation:buttonBreath 3.2s ease-in-out infinite;pointer-events:none}
#playHero .gleam{position:absolute;inset:2% 6%;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%);background:linear-gradient(105deg,transparent 30%,rgba(255,65,93,.14) 50%,transparent 68%);background-size:180% 100%;animation:titleSweep 7s ease-in-out infinite;opacity:.6;pointer-events:none}
#entryBurst{position:absolute;z-index:30;inset:0;display:grid;place-items:center;background:#061829f5;opacity:0;pointer-events:none;transition:opacity .65s ease}
#entryBurst.active{opacity:1;pointer-events:auto}
#entryBurst .entryInner{width:min(68vw,630px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:1.3rem}
#entryBurst img{width:min(62vw,600px);height:auto;filter:drop-shadow(0 0 24px #d42b442e)}
#entryBurst .entryLabel{font-weight:800;font-size:clamp(.7rem,1.55vw,1.2rem);letter-spacing:.22em;text-transform:uppercase}
#entryBurst .progressOuter{width:min(34vw,300px);height:3px;background:#a8b8ce48;border-radius:9px;overflow:hidden}
#entryBurst .progressInner{display:block;height:100%;width:100%;background:linear-gradient(90deg,#af253d,#fa5f6a);transform-origin:left;animation:fillProgress 1.9s ease-in-out forwards}
#entryBurst .entryCaption{color:#bccbd5;font-size:clamp(.66rem,1.15vw,.86rem)}
#entryBurst button{color:#eee;border:1px solid #ffffff52;background:#142338;padding:.6rem 1.25rem;border-radius:9px}
#watermark{position:absolute;z-index:25;left:50%;bottom:1.4%;transform:translateX(-50%);font-size:clamp(8px,.8vw,10px);letter-spacing:.09em;color:#fce8ddaa;text-shadow:0 1px 5px #000a;white-space:nowrap;pointer-events:none;opacity:.65}
body.embedded #modeTools,body.embedded #watermark,body.embedded #entryBurst .entryCaption,body.embedded #entryBurst #returnBtn{display:none}
#modeTools{position:absolute;z-index:50;top:9px;right:11px;display:flex;align-items:center;gap:5px;opacity:.36;transition:opacity .25s}
#modeTools:hover,#modeTools:focus-within{opacity:1}
#modeTools button{font-size:10px;letter-spacing:.03em;background:#0a1b30a9;color:#e9f4ff;border:1px solid #ffffff4a;border-radius:7px;padding:6px 9px}
#loginPreview{position:absolute;inset:0;z-index:27;background:#071423db;display:none;align-items:center;justify-content:center;backdrop-filter:blur(13px)}
#loginPreview.show{display:flex}
.loginCard{width:min(88vw,490px);display:flex;flex-direction:column;align-items:center;padding:3vh 3.5vw;border:1px solid #a5d2ec35;background:linear-gradient(160deg,#1c334ccc,#0a192cb8);border-radius:14px;box-shadow:0 22px 70px #0008}
.loginCard img{width:min(77%,400px);height:auto;filter:drop-shadow(0 0 8px #e5515734)}
.loginCard p{color:#bdc8db;font-size:clamp(10px,1.45vw,14px)}
.loginCard button{padding:10px 22px;border:1px solid #dbe4f4bd;background:#f6f7f8;color:#263449;border-radius:8px;font-size:clamp(11px,1.5vw,16px);font-weight:750}
.loginCard small{font-size:10px;opacity:.62;margin-top:1rem}
/* V67: maintain the approved 1672:941 art ratio on ultrawide landscape phones. The blurred edgeFill letterboxes without stretching figures or logos. */
@media(max-height:520px){#watermark{bottom:1%}.loginCard{padding:8px 20px}.loginCard img{width:min(72%,320px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#land{transform:none}#blueprint{opacity:.78}}
@keyframes sceneDrift{0%{transform:scale(1.019) translate3d(-.28%,.13%,0)}100%{transform:scale(1.045) translate3d(.32%,-.24%,0)}}
@keyframes holoPulse{0%,100%{opacity:.28;filter:drop-shadow(0 0 2px #08c9ff)}42%{opacity:.82;filter:drop-shadow(0 0 15px #27e7ff)}63%{opacity:.65;filter:drop-shadow(0 0 7px #23dfff)}}
@keyframes sunBreathe{0%,100%{opacity:.43}50%{opacity:.82}}
@keyframes floatDust{0%{transform:translate3d(0,8vh,0) scale(.35);opacity:0}15%{opacity:.34}80%{opacity:.18}100%{transform:translate3d(var(--drift),-83vh,0) scale(1.2);opacity:0}}
@keyframes titleSweep{0%,24%{background-position:180% center}55%,100%{background-position:-130% center}}
@keyframes buttonBreath{0%,100%{opacity:.16;transform:scale(.95)}50%{opacity:.54;transform:scale(1.015)}}
@keyframes fillProgress{from{transform:scaleX(.03)}to{transform:scaleX(1)}}
/* V65 · Blueprint buildings assemble in staggered stages. These short
   vector strokes align to the actual approved structures; no video/render loop. */
#buildLines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;mix-blend-mode:screen;filter:drop-shadow(0 0 3px #14cfff);}
.build-site{opacity:.82}
.construct-line{fill:none;stroke:#3de5ff;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;opacity:0;animation:blueprintConstruct 15s linear infinite;animation-delay:calc(var(--site-phase) + var(--stage-delay,0s));}
.construct-line.foundation{--stage-delay:0s;stroke:#50eeff;stroke-width:2.1}
.construct-line.structure{--stage-delay:1.5s}
.construct-line.details{--stage-delay:3s;stroke-width:1.15;stroke:#83f2ff}
.construct-trace{fill:none;stroke:#b6fbff;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:5 95;stroke-dashoffset:100;opacity:0;animation:blueprintEnergy 15s linear infinite;animation-delay:calc(var(--site-phase) + 3.4s);filter:drop-shadow(0 0 4px #3be4ff)}
.holo-node{fill:#b8ffff;opacity:0;animation:blueprintNode 15s ease-in-out infinite;animation-delay:calc(var(--site-phase) + 3.6s);filter:drop-shadow(0 0 4px #6feaff)}
@keyframes blueprintConstruct{0%,6%{stroke-dashoffset:100;opacity:0}9%{opacity:.94}30%,75%{stroke-dashoffset:0;opacity:.94}86%{stroke-dashoffset:0;opacity:.62}99%,100%{stroke-dashoffset:-100;opacity:0}}
@keyframes blueprintEnergy{0%,9%{opacity:0;stroke-dashoffset:100}15%{opacity:.95}63%{stroke-dashoffset:-130;opacity:.95}70%,100%{stroke-dashoffset:-160;opacity:0}}
@keyframes blueprintNode{0%,15%{opacity:0}25%,37%{opacity:1}45%,57%{opacity:.42}65%,77%{opacity:.95}93%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.construct-line{animation:none;stroke-dashoffset:0;opacity:.7}.construct-trace,.holo-node{animation:none;opacity:0}}
/* V65.1 · Low drifting Atacama dust (foreground atmosphere, behind JUGAR).
   Only a handful of translucent radial gradients and grains: no canvas or video. */
#groundDust{position:absolute;inset:0;pointer-events:none;z-index:7;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,transparent 67%,#000 83%,#000 96%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0%,transparent 67%,#000 83%,#000 96%,transparent 100%)}
#groundDust .dust-bank{position:absolute;bottom:var(--bottom);left:-40%;width:var(--width);height:var(--height);
  background:radial-gradient(ellipse at 48% 55%,rgba(229,181,126,.32),rgba(215,153,95,.19) 31%,rgba(185,140,111,.07) 61%,transparent 77%);
  opacity:0;transform:translate3d(-12vw,0,0) scale(.84);animation:dustAcross var(--dur) linear infinite;
  animation-delay:var(--delay);will-change:transform,opacity}
#groundDust .foot-lift{position:absolute;left:var(--left);bottom:var(--bottom);
  width:var(--width);height:var(--height);pointer-events:none;
  background:radial-gradient(ellipse at 45% 65%,rgba(244,192,136,.44) 0%,rgba(213,161,105,.19) 36%,transparent 74%);
  opacity:0;animation:footDustRoll var(--dur) ease-in-out infinite;
  animation-delay:var(--delay);will-change:transform,opacity}
@keyframes footDustRoll{0%{transform:translate3d(-2vw,1vh,0) scale(.6);opacity:0}
  24%{opacity:.52}66%{opacity:.34}100%{transform:translate3d(8vw,-1vh,0) scale(1.4);opacity:0}}
#groundDust .ground-grit{position:absolute;left:-8%;bottom:var(--bottom);width:clamp(1px,.16vw,3px);height:clamp(1px,.12vw,2px);
  border-radius:50%;background:#e8b988;opacity:0;animation:gritAcross var(--dur) linear infinite;
  animation-delay:var(--delay);will-change:transform,opacity}
@keyframes dustAcross{0%{transform:translate3d(-16vw,1vh,0) scale(.70);opacity:0}
  13%{opacity:var(--peak)}48%{opacity:calc(var(--peak)*.78)}82%{opacity:calc(var(--peak)*.50)}
  100%{transform:translate3d(142vw,-2vh,0) scale(1.38);opacity:0}}
@keyframes gritAcross{0%{transform:translate3d(-5vw,1vh,0);opacity:0}12%{opacity:.45}
  64%{opacity:.28}100%{transform:translate3d(118vw,-.7vh,0);opacity:0}}
@media(max-height:520px){#groundDust .dust-bank{opacity:0;animation-duration:calc(var(--dur)*1.15)}}
@media(prefers-reduced-motion:reduce){#groundDust .dust-bank,#groundDust .ground-grit,#groundDust .foot-lift{animation:none;opacity:0}}
</style>

 const dust=$('dust');
 for(let i=0;i<26;i++){
  const sp=document.createElement('i');sp.className='dust';
  const x=((i*41+17)%97)+'%',duration=(8+(i*13)%19)+'s';
  sp.style.setProperty('--x',x);sp.style.setProperty('--dur',duration);
  sp.style.setProperty('--delay',(-1*((i*7)%19))+'s');
  sp.style.setProperty('--drift',((i%2?1:-1)*(14+(i*29)%100))+'px');
  dust.append(sp);
 }
 let loaded=false;const embedded=new URLSearchParams(location.search).has('embedded');
 document.body.classList.toggle('embedded',embedded);
 $('playHero').addEventListener('click',()=>{
   $('entryBurst').classList.add('active');$('playHero').disabled=true;
   if(embedded&&window.parent!==window)window.parent.postMessage({type:'drillrun-welcome-enter-v64'},window.location.origin);
   loaded=true;
 });
 $('returnBtn').addEventListener('click',()=>{$('entryBurst').classList.remove('active');$('playHero').disabled=false;});
 const setLogin=isLogin=>{
  $('loginPreview').classList.toggle('show',isLogin);
  $('loginPreview').setAttribute('aria-hidden',String(!isLogin));
  $('playHero').disabled=isLogin;
 };
 $('viewWelcome').addEventListener('click',()=>setLogin(false));
 $('viewLogin').addEventListener('click',()=>setLogin(true));
 $('loginPreviewButton').addEventListener('click',()=>setLogin(false));
 if(new URLSearchParams(location.search).get('view')==='login')setLogin(true);
})();
</script>
</body></html>
