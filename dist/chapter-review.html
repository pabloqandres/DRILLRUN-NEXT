<!doctype html><html lang="es"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRILL RUN · Capítulo 01 · Revisión mobile</title><style>html,body{margin:0;background:#091c29;color:#e4dfd2;font:13px Arial;min-height:100%;display:grid;place-items:center}main{text-align:center;padding:20px}h1{font-size:15px;letter-spacing:2px;font-weight:500}p{color:#9fb4ba}iframe{width:844px;height:390px;max-width:94vw;border:0;border-radius:16px;box-shadow:0 0 0 7px #203746;margin:22px 0}a{color:#f5bf66}select{font:inherit;color:#d4c3a5;border:1px solid #ffffff24;border-radius:5px;background:#20333e;padding:5px}</style><main><h1>DRILL RUN · INDUSTRIAL MOBILE UI</h1><p>HOTFIX 005 CONSOLIDADO · Capítulo 01 · <select id="reviewSize" aria-label="Resolución de revisión"><option value="844,390">844 × 390</option><option value="667,375">667 × 375</option><option value="568,320">568 × 320</option></select> <label><input id="reviewHelpers" type="checkbox" checked> Ayudas de revisión</label> <label><input id="reviewLoading" type="checkbox"> Ver diseño de carga</label></p><iframe src="./index.html" title="Primer capítulo en mobile horizontal"></iframe><div><a href="./index.html">Abrir juego a pantalla completa</a></div></main><script>if(new URLSearchParams(location.search).has('qa'))document.querySelector('iframe').src='./index.html?chapterqa=1';document.querySelector('#reviewSize').onchange=e=>{const [w,h]=e.target.value.split(',');const frame=document.querySelector('iframe');frame.style.width=w+'px';frame.style.height=h+'px';};document.querySelector('#reviewHelpers').onchange=e=>{const bar=document.querySelector('iframe').contentDocument?.querySelector('#chapterQA');if(bar)bar.style.display=e.target.checked?'':'none';};document.querySelector('#reviewLoading').onchange=e=>{const loading=document.querySelector('iframe').contentDocument?.querySelector('#loading');if(loading){if(e.target.checked)loading.style.setProperty('display','flex','important');else loading.style.re
