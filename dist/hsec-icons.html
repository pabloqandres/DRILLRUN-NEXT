<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071722"><title>DRILL RUN · Íconos HSEC V4</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 25% 0,#173a50,#071722 65%);color:#f8fbff;font:14px system-ui,sans-serif;min-height:100svh;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}main{max-width:1080px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:26px}h1{font-size:27px;margin:0;letter-spacing:-1px}h1 span{color:#ffc83d}.kicker{font-size:10px;letter-spacing:2px;color:#91b5cb;margin:9px 0 0}button,a{font:inherit;color:inherit}nav{display:flex;gap:5px;border:1px solid #345466;padding:5px;border-radius:13px}button{border:0;background:transparent;padding:10px 16px;border-radius:9px;cursor:pointer;min-height:44px}button[aria-pressed=true]{background:#274459;box-shadow:inset 0 1px 0 #6c90a0;color:#fff}a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#c3dae7;min-height:44px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{min-width:0;border:1px solid #31536a;background:linear-gradient(150deg,#19364a,#0b1d2b);padding:24px;border-radius:16px;position:relative}.card:before{content:'';position:absolute;left:24px;top:0;width:48px;height:2px;background:var(--accent);box-shadow:0 0 16px var(--accent)}.art{height:110px;display:flex;align-items:center;justify-content:center}.art svg{height:72px;width:72px;overflow:visible}body.neon .art svg{filter:drop-shadow(0 0 8px var(--accent))}h2{font-size:15px;margin:18px 0 10px;line-height:1.35;min-height:40px}.sizes{display:flex;align-items:center;gap:18px;color:#95b3c5}.sizes svg{width:24px;height:24px;flex:none}.sizes span{font-size:11px}.footer{margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:12px;color:#99b6c8}.footer p{margin:0;max-width:650px;line-height:1.6}@media(max-width:720px){body{padding:18px}.cards{gap:10px}.card{padding:15px}.art{height:76px}.art svg{width:56px;height:56px}h2{font-size:12px}.sizes{gap:8px}.sizes span{font-size:10px}header{gap:12px;margin-bottom:18px}h1{font-size:21px}button{padding:10px}.kicker{font-size:8px}.footer{align-items:flex-start}}@media(max-width:480px){.cards{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;flex-direction:column}}
</style></head><body><main><header><div><h1>DRILL<span>RUN</span></h1><p class="kicker">HSEC · V4 APROBADOS</p></div><nav aria-label="Variante de íconos"><button data-variant="white" aria-pressed="true">Blanco</button><button data-variant="neon" aria-pressed="false">Neón</button></nav></header><div class="cards" id="icons"></div><div class="footer"><p>Una familia vectorial, trazo uniforme y fondo transparente. El color identifica la categoría HSEC; la prioridad de misión conserva sus propios colores.</p><a href="./">Volver al juego →</a></div></main><script type="module">
import {HSEC_CATEGORIES,hsecSymbol} from './hsec/icons.mjs';
let white=true;function render(){document.body.classList.toggle('neon',!white);document.querySelector('#icons').innerHTML=HSEC_CATEGORIES.map(c=>`<article class="card" style="--accent:${c.color}"><div class="art">${hsecSymbol(c.id,'',white)}</div><h2>${c.name}</h2><div class="sizes">${hsecSymbol(c.id,'',white)}<span>24 px · HUD</span>${hsecSymbol(c.id,'',white).replace('class=""','style="width:18px;height:18px"')}<span>18 px</span></div></article>`).join('');}document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{white=b.dataset.variant==='white';document.querySelectorAll('[data-variant]').forEach(v=>v.setAttribute('aria-pressed',String(v===b)));render();});render();
</script></body></html>
