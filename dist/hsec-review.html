<!doctype html><html lang="es"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRILL RUN · Misión 2 · Revisión</title><style>html,body{margin:0;background:#071722;color:#eaf5ff;font:13px system-ui,sans-serif;min-height:100%;display:grid;place-items:center}main{text-align:center;padding:20px}h1{font-size:18px;letter-spacing:1px}p{color:#a3bed0}iframe{display:block;width:844px;height:390px;max-width:94vw;border:1px solid #466f85;border-radius:16px;margin:20px auto}button,select{font:inherit;color:#eaf5ff;background:#18364a;border:1px solid #456b82;border-radius:8px;padding:9px 12px;min-height:40px;cursor:pointer}nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}a{color:#ffc83d}small{display:block;margin:12px;color:#9ebccd}</style><main><h1>DRILL RUN · MISIÓN 2</h1><p>Revisión de infraestructura, circulación segura y prevencionista · <select id="size" aria-label="Resolución"><option value="844,390">844 × 390</option><option value="667,375">667 × 375</option><option value="568,320">568 × 320</option></select></p><nav><button data-qa="qaHsec">Comenzar muestra de Misión 2</button><button data-qa="qaHsecSetup">Montar infraestructura de prueba</button><button data-qa="qaHsecWear">Probar desgaste</button><button data-qa="qaHsecNight">Revisar noche</button><button data-qa="qaHsecFollow">Seguir prevencionista</button><button data-qa="qaHsecRecord">Grabar recorrido 12 s</button><a id="movie" hidden>Descargar recorrido</a><button data-qa="qaHsecSave">Guardar muestra</button><button data-qa="qaHsecRestore">Recuperar muestra</button><button id="helpers">Mostrar/ocultar controles QA</button></nav><small>Primero pulsa Continuar partida o inicia una nueva partida dentro del juego. La muestra de revisión conserva tu guardado previo.</small><iframe src="./index.html?chapterqa=1" title="Misión 2 en mobile horizontal"></iframe><a href="./">Abrir juego normal</a></main><script>const f=document.querySelector('iframe');let showHelpers=false;document.querySelector('#size').onchange=e=>{const[w,h]=e.target.value.split(',');f.style.width=w+'px';f.style.height=h+'px';};document.querySelectorAll('[data-qa]').forEach(b=>b.onclick=()=>f.contentDocument?.getElementById(b.dataset.qa)?.click());document.querySelector('#helpers').onclick=()=>{const bar=f.contentDocument?.getElementById('chapterQA');showHelpers=!showHelpers;if(bar)bar.style.display=showHelpers?'flex':'none';};setInterval(()=>{const bar=f.contentDocument?.getElementById('chapterQA');if(bar)bar.style.display=showHelpers?'flex':'none';const src=f.contentDocument?.getElementById('cinemaDownload'),dst=document.querySelector('#movie');if(src){dst.href=src.href;dst.download=src.download;dst.hidden=false;}},500);</script></html>
