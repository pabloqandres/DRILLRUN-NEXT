<!doctype html><html lang="es"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRILL RUN · Cámara B · Revisión</title><style>html,body{margin:0;background:#091c29;color:#e4dfd2;font:13px Arial;min-height:100%;display:grid;place-items:center}main{text-align:center;padding:18px}h1{font-size:15px;letter-spacing:2px;font-weight:500}p{color:#adc0c4}iframe{width:844px;height:390px;max-width:94vw;border:0;border-radius:16px;box-shadow:0 0 0 7px #203746;margin:20px 0}a{color:#f5bf66}select{padding:5px;color:#eee;background:#20333e;border-radius:5px}</style><main><h1>DRILL RUN · CÁMARA B APROBADA</h1><p>Revisión de cámara, intro y transición · <select id="reviewSize" aria-label="Resolución"><option value="844,390">844 × 390</option><option value="667,375">667 × 375</option><option value="568,320">568 × 320</option></select> · <a id="reviewMovie" hidden>Descargar grabación</a> <a id="reviewHandoff" hidden>Primer frame 3D</a> <a id="reviewOfficePNG" hidden>PNG oficina</a></p><iframe src="./index.html?chapterqa=1&amp;dev=camera" title="Revisión de cámara en mobile horizontal"></iframe><div><a href="./index.html?chapterqa=1&amp;dev=camera">Abrir revisión y grabación a pantalla completa</a></div></main><script>document.querySelector('#reviewSize').onchange=e=>{const[w,h]=e.target.value.split(',');const f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=h+'px';};setInterval(()=>{const d=document.querySelector('iframe').contentDocument;for(const[from,to]of [['cinemaDownload','reviewMovie'],['handoffDownload','reviewHandoff'],['officePNGDownload','reviewOfficePNG']]){const src=d?.getElementById(from),dst=document.getElementById(to);if(src){dst.href=src.href;dst.download=src.download;dst.hidden=false;}else dst.hidden=true;}},500);</script></html>
