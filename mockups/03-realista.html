<!DOCTYPE html>

<title>Propuesta 3 · 3D Estilizado Realista</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:100vw; height:100vh; overflow:hidden; background:#0D1F3C; font-family:'Segoe UI',system-ui,sans-serif; }
canvas { display:block; }

/* REALISTIC / PREMIUM HUD */
#topbar {
  position:fixed; top:0; left:0; right:0;
  padding:12px 16px;
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(to bottom, rgba(13,31,60,0.92), transparent);
  pointer-events:all;
}
.res-pill {
  display:flex; align-items:center; gap:5px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:20px;
  padding:5px 12px;
  font-size:12px; font-weight:600; color:#fff;
  backdrop-filter:blur(10px);
}
.res-pill .icon { font-size:14px; }
.res-val { color:#FFD700; font-weight:700; }

/* SIDE PANEL - right info */
#side-info {
  position:fixed; right:0; top:56px; bottom:68px;
  width:130px;
  display:flex; flex-direction:column; gap:8px;
  padding:12px 8px;
  background:linear-gradient(to left, rgba(13,31,60,0.85), transparent);
  pointer-events:none;
}
.info-card {
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;
  padding:8px 10px;
  backdrop-filter:blur(8px);
}
.ic-label { font-size:8px; letter-spacing:1.5px; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-bottom:3px; }
.ic-val { font-size:13px; font-weight:700; color:#fff; }
.ic-sub { font-size:10px; color:rgba(255,255,255,0.5); margin-top:1px; }
.ic-bar { height:4px; background:rgba(255,255,255,0.1); border-radius:2px; margin-top:5px; overflow:hidden; }
.ic-fill { height:100%; border-radius:2px; }
.ic-fill.green { background:linear-gradient(90deg,#00B894,#55EFC4); width:72%; }
.ic-fill.orange { background:linear-gradient(90deg,#E67E22,#F39C12); width:45%; }
.ic-fill.blue { background:linear-gradient(90deg,#0984E3,#74B9FF); width:88%; }

/* BOTTOM TABS */
#bottomnav {
  position:fixed; bottom:0; left:0; right:0;
  height:60px;
  background:rgba(13,31,60,0.92);
  border-top:1px solid rgba(255,255,255,0.08);
  display:flex; align-items:center; justify-content:space-around;
  backdrop-filter:blur(12px);
  pointer-events:all;
}
.nav-item {
  display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:6px 12px; border-radius:10px; cursor:pointer;
}
.nav-item.active { background:rgba(255,107,0,0.12); }
.nav-item .ni { font-size:20px; }
.nav-item .nl { font-size:8px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; color:rgba(255,255,255,0.4); }
.nav-item.active .nl { color:#FF6B00; }

/* ACTION */
#fab {
  position:fixed; bottom:72px; right:16px;
  width:52px; height:52px;
  background:linear-gradient(135deg,#FF6B00,#FFD700);
  border-radius:50%;
  border:none;
  display:flex; align-items:center; justify-content:center;
  font-size:22px;
  box-shadow:0 4px 24px rgba(255,107,0,0.4), 0 0 0 4px rgba(255,107,0,0.1);
  cursor:pointer; pointer-events:all;
}

#back { position:fixed; top:14px; right:14px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); border-radius:20px; padding:5px 14px; font-size:11px; color:rgba(255,255,255,0.5); cursor:pointer; text-decoration:none; backdrop-filter:blur(8px); }
#style-tag { position:fixed; top:60px; left:16px; background:rgba(255,107,0,0.15); border:1px solid #FF6B00; border-radius:20px; padding:4px 12px; font-size:9px; font-weight:700; color:#FF6B00; letter-spacing:1px; text-transform:uppercase; }
</style>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H;
function resize() { W = c.width = window.innerWidth; H = c.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// REALISTIC / CINEMATIC STYLE
// Softer colors, gradients, subtle lighting, perspective-shifted

let t = 0;

function drawPremiumSky() {
  // Deep gradient sky
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.65);
  g.addColorStop(0, '#05101F');
  g.addColorStop(0.3, '#0D1F3C');
  g.addColorStop(0.6, '#1B3A6B');
  g.addColorStop(1, '#2A5F8A');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H * 0.65);

  // Atmospheric glow (sunrise/golden hour feel)
  const glow = ctx.createRadialGradient(W*0.7, H*0.4, 0, W*0.7, H*0.4, W*0.5);
  glow.addColorStop(0, 'rgba(255,140,0,0.15)');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H * 0.65);

  // Stars (subtle)
  for (let i = 0; i < 60; i++) {
    const sx = (Math.sin(i*137.5)*0.5+0.5)*W;
    const sy = (Math.sin(i*97.3)*0.25+0.1)*H;
    const sr = 0.5 + Math.sin(t*0.05+i)*0.3;
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${0.3+Math.sin(t*0.03+i)*0.2})`;
    ctx.fill();
  }

  // Andes mountain silhouettes (layered)
  const layers = [
    { pts: [[0,0.52],[0.08,0.32],[0.18,0.42],[0.28,0.25],[0.4,0.35],[0.5,0.22],[0.62,0.30],[0.75,0.20],[0.85,0.28],[1,0.35],[1,0.65]], col: '#081525' },
    { pts: [[0,0.55],[0.05,0.40],[0.15,0.48],[0.25,0.36],[0.38,0.44],[0.52,0.33],[0.65,0.42],[0.78,0.38],[0.92,0.45],[1,0.52],[1,0.65]], col: '#0D1E35' },
    { pts: [[0,0.58],[0.1,0.48],[0.22,0.54],[0.35,0.46],[0.5,0.52],[0.65,0.48],[0.8,0.53],[1,0.56],[1,0.65]], col: '#132840' },
  ];
  layers.forEach(({pts, col}) => {
    ctx.beginPath();
    ctx.moveTo(0, H*0.65);
    pts.forEach(([px,py]) => ctx.lineTo(px*W, py*H));
    ctx.lineTo(W, H*0.65);
    ctx.closePath();
    ctx.fillStyle = col;
    ctx.fill();
  });

  // Sun glow on horizon
  const sunG = ctx.createRadialGradient(W*0.72, H*0.55, 0, W*0.72, H*0.55, W*0.3);
  sunG.addColorStop(0, 'rgba(255,160,60,0.25)');
  sunG.addColorStop(0.4, 'rgba(255,100,0,0.08)');
  sunG.addColorStop(1, 'transparent');
  ctx.fillStyle = sunG;
  ctx.fillRect(0, H*0.3, W, H*0.35);
}

function drawGround() {
  // Ground with subtle terrain undulation
  const g = ctx.createLinearGradient(0, H*0.55, 0, H);
  g.addColorStop(0, '#8B6640');
  g.addColorStop(0.3, '#A07850');
  g.addColorStop(1, '#6B4828');
  ctx.fillStyle = g;
  ctx.fillRect(0, H*0.55, W, H*0.45);

  // Ground surface line
  ctx.beginPath();
  ctx.moveTo(0, H*0.56);
  for (let x = 0; x <= W; x += W/20) {
    ctx.lineTo(x, H*0.55 + Math.sin(x/W*Math.PI*3)*6);
  }
  ctx.lineTo(W, H*0.55);
  ctx.closePath();
  const sg = ctx.createLinearGradient(0, H*0.52, 0, H*0.6);
  sg.addColorStop(0, '#C4956A');
  sg.addColorStop(1, '#A07850');
  ctx.fillStyle = sg;
  ctx.fill();

  // Dirt path (worn track)
  ctx.beginPath();
  ctx.moveTo(W*0.35, H*0.57);
  ctx.bezierCurveTo(W*0.4, H*0.62, W*0.5, H*0.65, W*0.65, H*0.66);
  ctx.lineWidth = 22;
  ctx.strokeStyle = '#8B6540';
  ctx.stroke();
  ctx.lineWidth = 14;
  ctx.strokeStyle = '#9B7550';
  ctx.stroke();

  // Subtle ambient occlusion under buildings
  [W*0.15, W*0.32, W*0.72].forEach(bx => {
    const ao = ctx.createRadialGradient(bx, H*0.59, 0, bx, H*0.59, W*0.1);
    ao.addColorStop(0, 'rgba(0,0,0,0.2)');
    ao.addColorStop(1, 'transparent');
    ctx.fillStyle = ao;
    ctx.fillRect(bx - W*0.12, H*0.54, W*0.24, H*0.1);
  });
}

// REALISTIC BUILDING
function realisticBuilding(x, y, w, h, gradTop, gradBot, label, accent) {
  // Soft shadow
  const shadow = ctx.createRadialGradient(x, y + 12, 0, x, y + 12, w*0.7);
  shadow.addColorStop(0, 'rgba(0,0,0,0.35)');
  shadow.addColorStop(1, 'transparent');
  ctx.fillStyle = shadow;
  ctx.beginPath();
  ctx.ellipse(x, y + 10, w*0.55, 12, 0, 0, Math.PI*2);
  ctx.fill();

  // Body gradient
  const bg = ctx.createLinearGradient(x - w/2, y - h, x + w/2, y);
  bg.addColorStop(0, gradTop);
  bg.addColorStop(1, gradBot);
  ctx.beginPath();
  ctx.roundRect(x - w/2, y - h, w, h, [6, 6, 0, 0]);
  ctx.fillStyle = bg;
  ctx.fill();

  // Subtle edge highlight (left rim light)
  const rim = ctx.createLinearGradient(x - w/2, y - h, x - w/2 + 6, y);
  rim.addColorStop(0, 'rgba(255,255,255,0.15)');
  rim.addColorStop(1, 'transparent');
  ctx.fillStyle = rim;
  ctx.fill();

  // Accent color band
  ctx.fillStyle = accent;
  ctx.fillRect(x - w/2, y - h * 0.92, w, h * 0.05);

  // Roof
  const rg = ctx.createLinearGradient(x - w/2 - 6, y - h, x + w/2 + 6, y - h);
  rg.addColorStop(0, 'rgba(255,255,255,0.05)');
  rg.addColorStop(0.5, 'rgba(255,255,255,0.12)');
  rg.addColorStop(1, 'rgba(255,255,255,0.02)');
  ctx.beginPath();
  ctx.moveTo(x - w/2 - 6, y - h);
  ctx.lineTo(x, y - h - h*0.22);
  ctx.lineTo(x + w/2 + 6, y - h);
  ctx.closePath();
  ctx.fillStyle = rg;
  ctx.fill();

  // Glass window
  const wg = ctx.createLinearGradient(x - w*0.12, y - h*0.72, x + w*0.12, y - h*0.48);
  wg.addColorStop(0, '#87CEEB');
  wg.addColorStop(0.5, '#B0E0FF');
  wg.addColorStop(1, '#5AB0CF');
  ctx.beginPath();
  ctx.roundRect(x - w*0.14, y - h*0.72, w*0.28, h*0.24, 3);
  ctx.fillStyle = wg;
  ctx.fill();
  // Window reflection
  ctx.beginPath();
  ctx.moveTo(x - w*0.1, y - h*0.72);
  ctx.lineTo(x - w*0.06, y - h*0.72);
  ctx.lineTo(x - w*0.13, y - h*0.48);
  ctx.lineTo(x - w*0.17, y - h*0.48);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fill();

  // Door
  const dg = ctx.createLinearGradient(x - w*0.09, y - h*0.38, x + w*0.09, y);
  dg.addColorStop(0, '#3A2510');
  dg.addColorStop(1, '#5A3A1A');
  ctx.beginPath();
  ctx.roundRect(x - w*0.09, y - h*0.38, w*0.18, h*0.38, [4, 4, 0, 0]);
  ctx.fillStyle = dg;
  ctx.fill();

  // Label (floating, clean)
  ctx.save();
  ctx.fillStyle = 'rgba(5,16,31,0.75)';
  const lw = label.length * 7 + 20;
  ctx.beginPath();
  ctx.roundRect(x - lw/2, y - h - 28, lw, 20, 10);
  ctx.fill();
  ctx.fillStyle = '#FFD700';
  ctx.font = `bold ${Math.max(9,w*0.1)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(label, x, y - h - 13);
  ctx.restore();
}

// REALISTIC RIG
let rigT = 0;
function realisticRig(x, y) {
  rigT += 0.03;
  const h = H * 0.4;
  const bw = 38;

  // Ground shadow
  const gs = ctx.createRadialGradient(x, y + 8, 0, x, y + 8, 50);
  gs.addColorStop(0, 'rgba(0,0,0,0.4)');
  gs.addColorStop(1, 'transparent');
  ctx.fillStyle = gs;
  ctx.beginPath();
  ctx.ellipse(x, y + 8, 48, 15, 0, 0, Math.PI*2);
  ctx.fill();

  // Crawler base
  const baseg = ctx.createLinearGradient(x - bw, y, x + bw, y - 18);
  baseg.addColorStop(0, '#1A2535');
  baseg.addColorStop(1, '#2C3A4A');
  ctx.beginPath();
  ctx.roundRect(x - bw, y - 18, bw*2, 20, 4);
  ctx.fillStyle = baseg;
  ctx.fill();
  // Rim light on base
  ctx.beginPath();
  ctx.roundRect(x - bw, y - 18, bw*2, 3, [4, 4, 0, 0]);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fill();

  // Tracks
  const trackG = ctx.createLinearGradient(0, y-8, 0, y+2);
  trackG.addColorStop(0, '#0F1820');
  trackG.addColorStop(1, '#1A2535');
  ctx.beginPath();
  ctx.roundRect(x - bw - 8, y - 8, 18, 10, 5);
  ctx.fillStyle = trackG;
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(x + bw - 10, y - 8, 18, 10, 5);
  ctx.fillStyle = trackG;
  ctx.fill();

  // Tower (tapered)
  const tw = 22;
  const twTip = 6;
  ctx.beginPath();
  ctx.moveTo(x - tw, y - 18);
  ctx.lineTo(x - twTip, y - h);
  ctx.lineTo(x + twTip, y - h);
  ctx.lineTo(x + tw, y - 18);
  ctx.closePath();
  const tg = ctx.createLinearGradient(x - tw, 0, x + tw, 0);
  tg.addColorStop(0, '#1A2535');
  tg.addColorStop(0.3, '#2C3A4A');
  tg.addColorStop(0.7, '#2C3A4A');
  tg.addColorStop(1, '#1A2535');
  ctx.fillStyle = tg;
  ctx.fill();
  // Left edge highlight
  ctx.beginPath();
  ctx.moveTo(x - tw, y - 18);
  ctx.lineTo(x - twTip, y - h);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.stroke();

  // Cross members (precision style)
  ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const p = (i + 0.5) / 5;
    const lw1 = tw * (1 - p) + twTip * p;
    const ry = y - 18 - (h - 18) * p;
    const rx2 = y - 18 - (h - 18) * (p + 0.2);
    const lw2 = tw * (1 - (p+0.2)) + twTip * (p+0.2);
    ctx.beginPath();
    ctx.moveTo(x - lw1, ry);
    ctx.lineTo(x + lw2 * 0.7, Math.max(rx2, y - h + 10));
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.stroke();
  }

  // DRILLCO stripe (subtle)
  const dsg = ctx.createLinearGradient(x - bw, y - 26, x + bw, y - 26);
  dsg.addColorStop(0, '#CC5000');
  dsg.addColorStop(0.5, '#FF6B00');
  dsg.addColorStop(1, '#CC5000');
  ctx.fillStyle = dsg;
  ctx.beginPath();
  ctx.roundRect(x - bw + 2, y - 28, (bw-2)*2, 5, 2);
  ctx.fill();

  // Drill string
  const dpY = H*0.14 + Math.sin(rigT)*3;
  const dg = ctx.createLinearGradient(x-3, 0, x+3, 0);
  dg.addColorStop(0, '#7F8C8D');
  dg.addColorStop(0.5, '#BDC3C7');
  dg.addColorStop(1, '#7F8C8D');
  ctx.fillStyle = dg;
  ctx.fillRect(x - 3, y - h * 0.12, 6, dpY);

  // Bit tip glow
  const bitG = ctx.createRadialGradient(x, y + dpY - h*0.12 + 10, 0, x, y + dpY - h*0.12 + 10, 20);
  bitG.addColorStop(0, 'rgba(255,200,60,0.6)');
  bitG.addColorStop(0.4, 'rgba(255,120,0,0.2)');
  bitG.addColorStop(1, 'transparent');
  ctx.fillStyle = bitG;
  ctx.fillRect(x-25, y + dpY - h*0.12, 50, 25);

  // Dust particles
  if (Math.random() < 0.35) {
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      const px = x + (Math.random()-0.5)*30;
      const py = y + dpY - h*0.12 + 15 + Math.random()*10;
      ctx.arc(px, py, Math.random()*3, 0, Math.PI*2);
      const alpha = Math.random()*0.5;
      ctx.fillStyle = `rgba(180,140,80,${alpha})`;
      ctx.fill();
    }
  }
}

// CHARACTER (realistic proportions)
let charX2 = 0, charWalk2 = 0;
function realisticChar(x, y, walk) {
  const s = Math.min(W,H) * 0.055;
  const bob = Math.sin(walk*0.2)*1.5;

  // Shadow
  const shadowG = ctx.createRadialGradient(x, y+4, 0, x, y+4, s*0.4);
  shadowG.addColorStop(0, 'rgba(0,0,0,0.35)');
  shadowG.addColorStop(1, 'transparent');
  ctx.fillStyle = shadowG;
  ctx.beginPath();
  ctx.ellipse(x, y+4, s*0.35, s*0.1, 0, 0, Math.PI*2);
  ctx.fill();

  const leg = Math.sin(walk*0.3)*6;

  // Legs
  function gradRect(x1,y1,w1,h1,c1,c2) {
    const g = ctx.createLinearGradient(x1,y1,x1+w1,y1);
    g.addColorStop(0,c1); g.addColorStop(1,c2);
    ctx.fillStyle=g;
    ctx.fillRect(x1,y1,w1,h1);
  }
  gradRect(x-s*0.14, y-s*0.55+bob, s*0.12, s*0.5+leg*0.15, '#1C2526','#2C3536');
  gradRect(x+s*0.02, y-s*0.55+bob, s*0.12, s*0.5-leg*0.15, '#1C2526','#2C3536');

  // Boots
  ctx.beginPath();
  ctx.roundRect(x-s*0.18, y-s*0.04+bob, s*0.16, s*0.09, 3);
  ctx.fillStyle = '#0F1515'; ctx.fill();
  ctx.beginPath();
  ctx.roundRect(x+s*0.02, y-s*0.04+bob, s*0.16, s*0.09, 3);
  ctx.fillStyle = '#0F1515'; ctx.fill();

  // Body
  const bg = ctx.createLinearGradient(x-s*0.2, y-s*1.3+bob, x+s*0.2, y-s*0.55+bob);
  bg.addColorStop(0,'#C0522A'); bg.addColorStop(1,'#A03A18');
  ctx.beginPath();
  ctx.roundRect(x-s*0.2, y-s*1.3+bob, s*0.4, s*0.75, 4);
  ctx.fillStyle = bg;
  ctx.fill();

  // Reflective safety stripes
  ctx.fillStyle = 'rgba(255,220,60,0.85)';
  ctx.fillRect(x-s*0.2, y-s*0.95+bob, s*0.4, s*0.06);
  ctx.fillRect(x-s*0.2, y-s*0.72+bob, s*0.4, s*0.04);

  // Arms
  gradRect(x-s*0.32, y-s*1.26+bob+leg*0.05, s*0.12, s*0.42,'#C0522A','#A03A18');
  gradRect(x+s*0.2, y-s*1.26+bob-leg*0.05, s*0.12, s*0.42,'#C0522A','#A03A18');

  // Neck
  ctx.fillStyle = '#D4956A';
  ctx.fillRect(x-s*0.05, y-s*1.38+bob, s*0.1, s*0.1);

  // Head
  const hg = ctx.createLinearGradient(x-s*0.17, y-s*1.68+bob, x+s*0.17, y-s*1.32+bob);
  hg.addColorStop(0,'#E8A87C'); hg.addColorStop(1,'#C47A50');
  ctx.beginPath();
  ctx.ellipse(x, y-s*1.5+bob, s*0.17, s*0.2, 0, 0, Math.PI*2);
  ctx.fillStyle = hg;
  ctx.fill();

  // Helmet
  const hg2 = ctx.createLinearGradient(x, y-s*1.78+bob, x, y-s*1.55+bob);
  hg2.addColorStop(0,'#FFE000'); hg2.addColorStop(1,'#CC9000');
  ctx.beginPath();
  ctx.arc(x, y-s*1.58+bob, s*0.2, Math.PI, 0);
  ctx.fillStyle = hg2;
  ctx.fill();
  // Brim
  ctx.beginPath();
  ctx.roundRect(x-s*0.24, y-s*1.5+bob, s*0.48, s*0.06, 3);
  ctx.fillStyle = '#CC9000';
  ctx.fill();
  // Reflection on helmet
  ctx.beginPath();
  ctx.arc(x - s*0.06, y - s*1.62 + bob, s*0.06, -Math.PI*0.8, -Math.PI*0.2);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawPremiumSky();
  drawGround();

  const bY = H * 0.595;
  realisticBuilding(W*0.14, bY, W*0.13, H*0.16, '#3D6A48','#2A4A32','TALLER','#52B788');
  realisticBuilding(W*0.30, bY - H*0.01, W*0.15, H*0.20, '#3A5A7A','#2A3A5A','OFICINA','#74B9FF');
  realisticBuilding(W*0.73, bY, W*0.13, H*0.15, '#6A4A2A','#4A3018','BODEGA','#FFA500');

  realisticRig(W * 0.54, H * 0.595);

  // Character
  charWalk2 += 0.5;
  charX2 += 0.4;
  if (charX2 > W * 0.62) charX2 = W * 0.28;
  realisticChar(charX2, H * 0.62, charWalk2);

  t++;
  requestAnimationFrame(draw);
}

document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
    el.classList.add('active');
  });
});

draw();
</script>
