<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Propuesta 2 · Cartoon Bold</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:100vw; height:100vh; overflow:hidden;
  background: #1A0A2E;
  font-family: 'Segoe UI', system-ui, sans-serif;
}
canvas { display:block; }

#ui {
  position:fixed; top:0; left:0; right:0; bottom:0;
  pointer-events:none; z-index:10;
}

/* TOP HUD - BOLD style */
#topbar {
  position:fixed; top:0; left:0; right:0;
  padding:10px 14px;
  display:flex; align-items:center; justify-content:space-between;
  pointer-events:all;
}
.pill-bold {
  display:flex; align-items:center; gap:5px;
  background:#1A0A2E;
  border:3px solid #000;
  border-radius:24px;
  padding:6px 14px;
  font-size:14px; font-weight:900;
  color:#fff;
  box-shadow: 3px 3px 0 #000;
}
.pill-bold .v { color:#FFE600; }
.pill-gold { background:#FFE600; color:#000; border-color:#000; }
.pill-gold .v { color:#000; }

/* COINS WITH BOUNCY ICON */
.coin-icon {
  width:22px; height:22px;
  background:#FFE600;
  border:2px solid #000;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:900;
  box-shadow:2px 2px 0 #000;
  animation: coin-bounce 1.5s ease-in-out infinite;
}
@keyframes coin-bounce {
  0%,100%{transform:translateY(0) rotate(0deg);}
  50%{transform:translateY(-4px) rotate(10deg);}
}

/* CONTRACT CARD - CARTOON */
#contract-card {
  position:fixed; top:68px; left:12px;
  background:#fff;
  border:3px solid #000;
  border-radius:16px;
  padding:10px 14px;
  min-width:185px;
  box-shadow:4px 4px 0 #000;
  pointer-events:all;
}
.cc-tag {
  background:#00C2FF;
  border:2px solid #000;
  border-radius:8px;
  padding:2px 8px;
  font-size:9px; font-weight:900;
  color:#000; text-transform:uppercase;
  letter-spacing:1px;
  display:inline-block; margin-bottom:6px;
}
.cc-title { font-size:13px; font-weight:900; color:#1A0A2E; margin-bottom:6px; }
.cc-bar {
  height:10px;
  background:#E0E0E0;
  border:2px solid #000;
  border-radius:6px;
  overflow:hidden;
}
.cc-fill {
  height:100%;
  background:linear-gradient(90deg,#00C2FF,#0080FF);
  border-radius:4px;
  width:35%;
  animation:bar-grow 3s ease-in-out infinite alternate;
}
@keyframes bar-grow { from{width:30%} to{width:42%} }
.cc-meta {
  display:flex; justify-content:space-between;
  margin-top:5px; font-size:10px; font-weight:700; color:#666;
}

/* LEVEL BADGE */
#level-badge {
  position:fixed; top:72px; right:12px;
  width:56px; height:56px;
  background:linear-gradient(135deg,#FFE600,#FF8C00);
  border:3px solid #000;
  border-radius:50%;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  box-shadow:4px 4px 0 #000;
  animation:badge-pulse 2s ease-in-out infinite;
}
@keyframes badge-pulse {
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.08);}
}
#level-badge .lv-label { font-size:8px; font-weight:900; color:#000; }
#level-badge .lv-num { font-size:18px; font-weight:900; color:#000; line-height:1; }

/* BOTTOM NAV - CARTOON TABS */
#bottomnav {
  position:fixed; bottom:0; left:0; right:0;
  background:#fff;
  border-top:3px solid #000;
  display:flex; align-items:stretch;
  height:68px;
  pointer-events:all;
}
.nav-tab {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:2px;
  cursor:pointer;
  transition:background 0.15s;
  border-right:2px solid #000;
  position:relative;
}
.nav-tab:last-child { border-right:none; }
.nav-tab.active { background:#FFE600; }
.nav-tab .ti { font-size:24px; }
.nav-tab .tl { font-size:8px; font-weight:900; text-transform:uppercase; letter-spacing:0.5px; color:#1A0A2E; }
.nav-tab.active .tl { color:#000; }
.nav-tab .tbadge {
  position:absolute; top:6px; right:8px;
  background:#FF0040; color:#fff;
  border:2px solid #000;
  border-radius:10px; padding:1px 5px;
  font-size:9px; font-weight:900;
}

/* ACTION BUTTON */
#action-btn {
  position:fixed; bottom:80px; right:14px;
  width:62px; height:62px;
  background:linear-gradient(135deg,#FF0040,#FF6B00);
  border:3px solid #000;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:28px;
  box-shadow:4px 4px 0 #000;
  cursor:pointer; pointer-events:all;
  animation:fab-bounce 1.8s ease-in-out infinite;
  transition:transform 0.1s;
}
@keyframes fab-bounce {
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-5px);}
}
#action-btn:active { transform:scale(0.92) translateY(2px); box-shadow:2px 2px 0 #000; }

/* STYLE TAG */
#style-tag {
  position:fixed; top:130px; right:12px;
  background:#FF0040;
  border:2px solid #000;
  border-radius:10px;
  padding:5px 10px;
  font-size:9px; font-weight:900;
  color:#fff; letter-spacing:1px;
  text-transform:uppercase;
  box-shadow:2px 2px 0 #000;
}

#back {
  position:fixed; top:14px; right:14px;
  background:#fff;
  border:2px solid #000;
  border-radius:20px;
  padding:5px 14px;
  font-size:11px; font-weight:700;
  color:#000; cursor:pointer;
  text-decoration:none;
  box-shadow:2px 2px 0 #000;
}

/* POPUP when tap action */
#popup {
  position:fixed; bottom:155px; right:14px;
  background:#fff;
  border:3px solid #000;
  border-radius:14px;
  padding:10px 14px;
  font-size:12px; font-weight:800;
  color:#1A0A2E;
  box-shadow:4px 4px 0 #000;
  transform:scale(0); transform-origin:bottom right;
  transition:transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events:none;
  white-space:nowrap;
}
#popup.show { transform:scale(1); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="topbar">
    <div style="display:flex;gap:8px">
      <div class="pill-bold"><div class="coin-icon">$</div><span class="v">4,280</span></div>
      <div class="pill-bold">⚡<span class="v">NV.3</span></div>
    </div>
    <div></div>
  </div>

  <div id="contract-card">
    <div class="cc-tag">Contrato activo</div>
    <div class="cc-title">Sondaje 45m · Zona Norte</div>
    <div class="cc-bar"><div class="cc-fill"></div></div>
    <div class="cc-meta"><span>⏱ 35%</span><span>💰 $1,200</span></div>
  </div>

  <div id="level-badge"><span class="lv-label">NIVEL</span><span class="lv-num">3</span></div>
  <div id="style-tag">Cartoon Bold</div>

  <div id="action-btn" onclick="togglePop()">⛏️</div>
  <div id="popup">¡Ir al frente de perforación!</div>

  <nav id="bottomnav">
    <div class="nav-tab active"><span class="ti">🏕️</span><span class="tl">Faena</span></div>
    <div class="nav-tab"><span class="ti">📋</span><span class="tl">Contratos</span><span class="tbadge">2</span></div>
    <div class="nav-tab"><span class="ti">🔧</span><span class="tl">Taller</span></div>
    <div class="nav-tab"><span class="ti">📦</span><span class="tl">Bodega</span></div>
    <div class="nav-tab"><span class="ti">👤</span><span class="tl">Perfil</span></div>
  </nav>

  <a href="../index.html" id="back">← Volver</a>
</div>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H;
function resize() { W = c.width = window.innerWidth; H = c.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

function togglePop() {
  const p = document.getElementById('popup');
  p.classList.toggle('show');
  setTimeout(() => p.classList.remove('show'), 2200);
}

// CARTOON RENDERING - 2.5D side view / slight iso
// Bright, saturated, thick outlines

function stroke(w = 3) {
  ctx.strokeStyle = '#000';
  ctx.lineWidth = w;
  ctx.stroke();
}

function fillStroke(fill, sw = 3) {
  ctx.fillStyle = fill;
  ctx.fill();
  stroke(sw);
}

// SKY
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.55);
  g.addColorStop(0, '#1A0A2E');
  g.addColorStop(0.4, '#2D1B69');
  g.addColorStop(1, '#5A4FCF');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H * 0.55);

  // Stars
  for (let i = 0; i < 40; i++) {
    ctx.beginPath();
    ctx.arc(
      (Math.sin(i * 137.5) * 0.5 + 0.5) * W,
      (Math.sin(i * 97.3) * 0.3 + 0.15) * H,
      1 + Math.sin(i) * 0.5 + Math.sin(Date.now() / 800 + i) * 0.3,
      0, Math.PI * 2
    );
    ctx.fillStyle = `rgba(255,255,255,${0.4 + Math.sin(Date.now()/600+i)*0.3})`;
    ctx.fill();
  }

  // Cartoon clouds
  function cloud(x, y, s) {
    ctx.beginPath();
    ctx.arc(x, y, s*0.7, 0, Math.PI*2);
    ctx.arc(x + s*0.6, y, s*0.5, 0, Math.PI*2);
    ctx.arc(x + s*1.2, y, s*0.6, 0, Math.PI*2);
    ctx.arc(x + s*0.6, y - s*0.4, s*0.55, 0, Math.PI*2);
    fillStroke('#fff', 2.5);
  }
  cloud(W*0.15, H*0.12, 22);
  cloud(W*0.6, H*0.08, 18);
  cloud(W*0.82, H*0.14, 25);

  // Moon
  ctx.beginPath();
  ctx.arc(W*0.88, H*0.1, 28, 0, Math.PI*2);
  fillStroke('#FFE600', 3);
  ctx.beginPath();
  ctx.arc(W*0.9, H*0.09, 22, 0, Math.PI*2);
  ctx.fillStyle = '#2D1B69';
  ctx.fill();
}

// GROUND
function drawGround() {
  // Main ground
  ctx.beginPath();
  ctx.moveTo(0, H*0.52);
  ctx.lineTo(W*0.3, H*0.48);
  ctx.lineTo(W*0.5, H*0.50);
  ctx.lineTo(W*0.8, H*0.47);
  ctx.lineTo(W, H*0.50);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  fillStroke('#C4956A', 3);

  // Dirt path
  ctx.beginPath();
  ctx.ellipse(W*0.5, H*0.58, W*0.18, H*0.06, 0, 0, Math.PI*2);
  fillStroke('#A07850', 2);

  // Grass patches
  function grass(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x - s, y);
    ctx.quadraticCurveTo(x - s*0.7, y - s*1.4, x - s*0.3, y);
    ctx.moveTo(x - s*0.2, y);
    ctx.quadraticCurveTo(x, y - s*1.8, x + s*0.3, y);
    ctx.moveTo(x + s*0.2, y);
    ctx.quadraticCurveTo(x + s*0.7, y - s*1.5, x + s, y);
    ctx.strokeStyle = '#3A7D44';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  grass(W*0.08, H*0.55, 10);
  grass(W*0.22, H*0.57, 8);
  grass(W*0.72, H*0.55, 9);
  grass(W*0.9, H*0.57, 11);
}

// CARTOON BUILDING
function cartoonBuilding(x, y, w, h, bodyCol, roofCol, label, icon) {
  // Shadow
  ctx.beginPath();
  ctx.ellipse(x, y + 8, w*0.55, 10, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fill();

  // Body
  ctx.beginPath();
  ctx.roundRect(x - w/2, y - h, w, h, [8, 8, 0, 0]);
  fillStroke(bodyCol, 3);

  // Roof
  ctx.beginPath();
  ctx.moveTo(x - w/2 - 6, y - h);
  ctx.lineTo(x, y - h - h*0.35);
  ctx.lineTo(x + w/2 + 6, y - h);
  ctx.closePath();
  fillStroke(roofCol, 3);

  // Window
  ctx.beginPath();
  ctx.roundRect(x - w*0.15, y - h*0.7, w*0.3, h*0.25, 4);
  fillStroke('#87CEEB', 2.5);
  // Window cross
  ctx.beginPath();
  ctx.moveTo(x, y - h*0.7);
  ctx.lineTo(x, y - h*0.45);
  ctx.moveTo(x - w*0.15, y - h*0.57);
  ctx.lineTo(x + w*0.15, y - h*0.57);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Door
  ctx.beginPath();
  ctx.roundRect(x - w*0.1, y - h*0.38, w*0.2, h*0.38, [6, 6, 0, 0]);
  fillStroke('#5A3A1A', 2.5);

  // Label
  ctx.fillStyle = '#000';
  ctx.font = `bold ${Math.max(10, w*0.14)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(icon + ' ' + label, x, y - h * 1.15);
}

// CARTOON RIG
let rigAnim = 0;
function cartoonRig(x, y) {
  rigAnim += 0.05;
  const h = H * 0.38;
  const w = 28;

  // Shadow
  ctx.beginPath();
  ctx.ellipse(x, y + 8, 35, 12, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fill();

  // Base / tracks
  ctx.beginPath();
  ctx.roundRect(x - 40, y - 14, 80, 18, 5);
  fillStroke('#2C3E50', 3);
  // Track wheels
  [x-28, x-10, x+10, x+28].forEach(wx => {
    ctx.beginPath();
    ctx.arc(wx, y+2, 7, 0, Math.PI*2);
    fillStroke('#1A252F', 2);
  });

  // Tower
  ctx.beginPath();
  ctx.moveTo(x - w/2, y - 14);
  ctx.lineTo(x - w/4, y - h);
  ctx.lineTo(x + w/4, y - h);
  ctx.lineTo(x + w/2, y - 14);
  ctx.closePath();
  fillStroke('#2C3E50', 3);

  // Cross braces
  ctx.strokeStyle = '#3A4555';
  ctx.lineWidth = 2.5;
  for (let i = 0.15; i < 1; i += 0.2) {
    ctx.beginPath();
    ctx.moveTo(x - w/2 * (1-i), y - h * i - 14);
    ctx.lineTo(x + w/2 * (1-i), y - h * (i+0.2) - 14);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + w/2 * (1-i), y - h * i - 14);
    ctx.lineTo(x - w/2 * (1-i), y - h * (i+0.2) - 14);
    ctx.stroke();
  }

  // Top crown
  ctx.beginPath();
  ctx.roundRect(x - 14, y - h - 18, 28, 20, 4);
  fillStroke('#3A4555', 3);

  // DRILLCO stripe
  ctx.beginPath();
  ctx.roundRect(x - 35, y - 26, 70, 10, 3);
  fillStroke('#FF6B00', 2);

  // Drill pipe (animated)
  const pipeY = H * 0.12 + Math.sin(rigAnim) * 4;
  ctx.beginPath();
  ctx.moveTo(x, y - h * 0.1);
  ctx.lineTo(x, y + pipeY);
  ctx.strokeStyle = '#95A5A6';
  ctx.lineWidth = 6;
  ctx.stroke();
  stroke(2);

  // Sparks
  if (Math.random() < 0.4) {
    for (let i = 0; i < 4; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 20;
      ctx.beginPath();
      ctx.arc(x + Math.cos(angle)*dist, y + pipeY + Math.sin(angle)*dist*0.4, 2, 0, Math.PI*2);
      ctx.fillStyle = Math.random() < 0.5 ? '#FFE600' : '#FF6B00';
      ctx.fill();
    }
  }

  // Label tag
  const tagW = 80;
  ctx.fillStyle = '#FF6B00';
  ctx.beginPath();
  ctx.roundRect(x - tagW/2, y - h - 42, tagW, 20, 5);
  ctx.fill();
  stroke(2.5);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('⛏ FRENTE PERFORACIÓN', x, y - h - 28);
}

// CARTOON CHARACTER
let charX, charY, charTarget, charStep = 0, charWalk = 0;
function initChar() {
  charX = W * 0.48;
  charY = H * 0.62;
  charTarget = W * 0.62;
}
initChar();

function cartoonChar(x, y, walk) {
  const s = Math.min(W, H) * 0.07;
  const bob = Math.sin(walk * 0.25) * 3;

  // Shadow
  ctx.beginPath();
  ctx.ellipse(x, y + 4, s*0.35, s*0.1, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fill();

  // Legs (cartoon thick)
  const legSwing = Math.sin(walk * 0.5) * 8;
  ctx.beginPath();
  ctx.roundRect(x - s*0.18, y - s*0.6 + bob, s*0.18, s*0.55 + legSwing*0.3, 4);
  fillStroke('#2C3E50', 2.5);
  ctx.beginPath();
  ctx.roundRect(x, y - s*0.6 + bob, s*0.18, s*0.55 - legSwing*0.3, 4);
  fillStroke('#2C3E50', 2.5);

  // Boots (big cartoon boots)
  ctx.beginPath();
  ctx.ellipse(x - s*0.1, y + bob + legSwing*0.1, s*0.18, s*0.1, 0.3, 0, Math.PI*2);
  fillStroke('#1A252F', 2.5);
  ctx.beginPath();
  ctx.ellipse(x + s*0.1, y + bob - legSwing*0.1, s*0.18, s*0.1, -0.3, 0, Math.PI*2);
  fillStroke('#1A252F', 2.5);

  // Body
  ctx.beginPath();
  ctx.roundRect(x - s*0.28, y - s*1.4 + bob, s*0.56, s*0.82, 8);
  fillStroke('#FF8C00', 3);

  // Safety vest stripes
  ctx.fillStyle = '#FFE600';
  ctx.fillRect(x - s*0.28, y - s*1.05 + bob, s*0.56, s*0.09);
  ctx.fillRect(x - s*0.28, y - s*0.78 + bob, s*0.56, s*0.07);
  stroke(1.5);

  // Arms
  const armSwing = Math.sin(walk * 0.5) * 12;
  ctx.save();
  ctx.translate(x - s*0.28, y - s*1.3 + bob);
  ctx.rotate((-0.3 + armSwing * 0.02) * Math.PI/4);
  ctx.beginPath();
  ctx.roundRect(0, 0, s*0.2, s*0.45, 6);
  fillStroke('#FF8C00', 2.5);
  ctx.restore();

  ctx.save();
  ctx.translate(x + s*0.08, y - s*1.3 + bob);
  ctx.rotate((0.3 - armSwing * 0.02) * Math.PI/4);
  ctx.beginPath();
  ctx.roundRect(0, 0, s*0.2, s*0.45, 6);
  fillStroke('#FF8C00', 2.5);
  ctx.restore();

  // Head (big cartoon head)
  ctx.beginPath();
  ctx.arc(x, y - s*1.65 + bob, s*0.32, 0, Math.PI*2);
  fillStroke('#F5CBA7', 3);

  // Eyes
  ctx.beginPath();
  ctx.arc(x - s*0.1, y - s*1.68 + bob, s*0.07, 0, Math.PI*2);
  fillStroke('#fff', 1.5);
  ctx.beginPath();
  ctx.arc(x - s*0.09, y - s*1.68 + bob, s*0.035, 0, Math.PI*2);
  ctx.fillStyle = '#000'; ctx.fill();

  ctx.beginPath();
  ctx.arc(x + s*0.1, y - s*1.68 + bob, s*0.07, 0, Math.PI*2);
  fillStroke('#fff', 1.5);
  ctx.beginPath();
  ctx.arc(x + s*0.11, y - s*1.68 + bob, s*0.035, 0, Math.PI*2);
  ctx.fillStyle = '#000'; ctx.fill();

  // Smile
  ctx.beginPath();
  ctx.arc(x, y - s*1.6 + bob, s*0.14, 0.1*Math.PI, 0.9*Math.PI);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Hard hat (OVERSIZED cartoon)
  ctx.beginPath();
  ctx.ellipse(x, y - s*1.92 + bob, s*0.42, s*0.22, 0, 0, Math.PI*2);
  fillStroke('#FFE600', 3);
  ctx.beginPath();
  ctx.ellipse(x, y - s*1.88 + bob, s*0.32, s*0.16, 0, 0, Math.PI*2);
  fillStroke('#FFE600', 2);
  // Hat brim
  ctx.beginPath();
  ctx.ellipse(x, y - s*1.88 + bob, s*0.43, s*0.09, 0, 0, Math.PI*2);
  fillStroke('#E5C800', 2.5);
}

// SAFETY CONE
function cartoonCone(x, y) {
  const s = 18;
  ctx.beginPath();
  ctx.moveTo(x, y - s*2);
  ctx.lineTo(x - s*0.7, y);
  ctx.lineTo(x + s*0.7, y);
  ctx.closePath();
  fillStroke('#FF6B00', 2.5);
  ctx.fillStyle = '#fff';
  ctx.fillRect(x - s*0.55, y - s*0.9, s*1.1, s*0.2);
  stroke(1.5);
}

// DRILLCO SIGN
function cartoonSign(x, y) {
  // Post
  ctx.beginPath();
  ctx.roundRect(x - 4, y - H*0.12, 8, H*0.12, 3);
  fillStroke('#8B6914', 2.5);
  // Sign board
  ctx.beginPath();
  ctx.roundRect(x - 44, y - H*0.14, 88, 26, 6);
  fillStroke('#FFE600', 3);
  ctx.fillStyle = '#000';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('⚡ DRILLCO®', x, y - H*0.09);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  drawSky();
  drawGround();

  // BUILDINGS
  const bY = H * 0.56;
  cartoonBuilding(W*0.13, bY, W*0.14, H*0.18, '#3D7A52', '#2D5A3A', 'TALLER', '🔧');
  cartoonBuilding(W*0.28, bY - H*0.02, W*0.16, H*0.22, '#4A8F60', '#357A50', 'OFICINA', '📋');
  cartoonBuilding(W*0.75, bY, W*0.13, H*0.16, '#3A5F8A', '#2A4560', 'BODEGA', '📦');

  // DRILLING RIG
  cartoonRig(W * 0.57, H * 0.58);

  // SAFETY ELEMENTS
  cartoonCone(W*0.48, H*0.61);
  cartoonCone(W*0.64, H*0.61);
  cartoonSign(W*0.38, H*0.61);

  // CHARACTER - walking
  charWalk += 0.6;
  if (charX < W * 0.62) charX += 0.5;
  else if (charX < W * 0.63) { charX = W * 0.3; }
  cartoonChar(charX, H * 0.62, charWalk);

  requestAnimationFrame(draw);
}

document.querySelectorAll('.nav-tab').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.nav-tab').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
  });
});

draw();
</script>
</body>
</html>
