  /* ACCION BTN */

<canvas id="c"></canvas>

<div id="hud">

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, tW, tH, offX, offY;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  tW = Math.min(W * 0.09, 72);
  tH = tW * 0.5;
  offX = W * 0.5;
  offY = H * 0.22;
}
resize();
window.addEventListener('resize', () => { resize(); });

// ISO PROJECTION
function iso(gx, gy) {
  return {
    x: offX + (gx - gy) * tW,
    y: offY + (gx + gy) * tH
  };
}

// COLORS
const C = {
  sky1: '#1B3A6B', sky2: '#2A5F8A', sky3: '#4A8AB0',
  ground1: '#B8956A', ground2: '#C4956A', ground3: '#D4A574',
  path: '#A07850', pathDark: '#8B6640',
  grass: '#3A7D44', grass2: '#2D6A35',
  buildGreen: '#3D7A52', buildGreenDark: '#2D5A3A', buildGreenTop: '#4A8F60',
  buildGray: '#5A6472', buildGrayDark: '#3A4450', buildGrayTop: '#6A7482',
  buildBrown: '#8B5E3C', buildBrownDark: '#6B4428', buildBrownTop: '#A06842',
  buildBlue: '#3A5F8A', buildBlueDark: '#2A4560', buildBlueTop: '#4A7A9A',
  rigDark: '#1A2030', rigMid: '#2A3040', rigLight: '#3A4555',
  drillcoPrimary: '#FF6B00',
  safetyOrange: '#FF6B00',
  white: '#FFFFFF',
  shadow: 'rgba(0,0,0,0.25)'
};

function drawTile(gx, gy, col, colL, colR) {
  const p = iso(gx, gy);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x + tW, p.y + tH);
  ctx.lineTo(p.x, p.y + tH * 2);
  ctx.lineTo(p.x - tW, p.y + tH);
  ctx.closePath();
  ctx.fillStyle = col;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.1)';
  ctx.lineWidth = 0.5;
  ctx.stroke();
}

function drawBox(gx, gy, gz, gw, gd, gh, colTop, colLeft, colRight, label) {
  // Top face
  const tl = iso(gx, gy + gd);
  const tr = iso(gx + gw, gy + gd);
  const br = iso(gx + gw, gy);
  const bl = iso(gx, gy);
  const baseY = gz * tH * 2;

  ctx.beginPath();
  ctx.moveTo(tl.x, tl.y - baseY - gh * tH * 2);
  ctx.lineTo(tr.x, tr.y - baseY - gh * tH * 2);
  ctx.lineTo(br.x, br.y - baseY - gh * tH * 2);
  ctx.lineTo(bl.x, bl.y - baseY - gh * tH * 2);
  ctx.closePath();
  ctx.fillStyle = colTop;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  // Left face
  ctx.beginPath();
  ctx.moveTo(tl.x, tl.y - baseY - gh * tH * 2);
  ctx.lineTo(bl.x, bl.y - baseY - gh * tH * 2);
  ctx.lineTo(bl.x, bl.y - baseY);
  ctx.lineTo(tl.x, tl.y - baseY);
  ctx.closePath();
  ctx.fillStyle = colLeft;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.stroke();

  // Right face
  ctx.beginPath();
  ctx.moveTo(bl.x, bl.y - baseY - gh * tH * 2);
  ctx.lineTo(br.x, br.y - baseY - gh * tH * 2);
  ctx.lineTo(br.x, br.y - baseY);
  ctx.lineTo(bl.x, bl.y - baseY);
  ctx.closePath();
  ctx.fillStyle = colRight;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.stroke();
}

// CHARACTER ANIMATION
let charGX = 4.5, charGY = 4.5;
let charTargetX = 4.5, charTargetY = 4.5;
let charAnim = 0;
let charDir = 1;

function drawCharacter(gx, gy, anim) {
  const p = iso(gx, gy);
  const s = tW * 0.55;
  const cx = p.x;
  const cy = p.y - s * 0.1;
  const bob = Math.sin(anim * 0.15) * 2;

  ctx.save();

  // Shadow
  ctx.beginPath();
  ctx.ellipse(cx, cy + 2, s * 0.3, s * 0.12, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fill();

  // Legs
  const legSwing = Math.sin(anim * 0.3) * 3;
  ctx.fillStyle = '#2C3E50';
  ctx.fillRect(cx - s * 0.12, cy - s * 0.4 + bob, s * 0.1, s * 0.35 + legSwing);
  ctx.fillRect(cx + s * 0.02, cy - s * 0.4 + bob, s * 0.1, s * 0.35 - legSwing);

  // Boots
  ctx.fillStyle = '#1A252F';
  ctx.fillRect(cx - s * 0.14, cy - s * 0.05 + bob + legSwing, s * 0.13, s * 0.09);
  ctx.fillRect(cx + s * 0.0, cy - s * 0.05 + bob - legSwing, s * 0.13, s * 0.09);

  // Body / vest
  ctx.fillStyle = '#E67E22';
  ctx.fillRect(cx - s * 0.2, cy - s * 0.9 + bob, s * 0.4, s * 0.5);

  // Reflective stripes
  ctx.fillStyle = '#F1C40F';
  ctx.fillRect(cx - s * 0.2, cy - s * 0.65 + bob, s * 0.4, s * 0.06);
  ctx.fillRect(cx - s * 0.2, cy - s * 0.52 + bob, s * 0.4, s * 0.04);

  // Arms
  const armSwing = Math.sin(anim * 0.3) * 4;
  ctx.fillStyle = '#E67E22';
  ctx.fillRect(cx - s * 0.32, cy - s * 0.88 + bob - armSwing, s * 0.12, s * 0.35);
  ctx.fillRect(cx + s * 0.2, cy - s * 0.88 + bob + armSwing, s * 0.12, s * 0.35);

  // Head
  ctx.fillStyle = '#F5CBA7';
  ctx.beginPath();
  ctx.ellipse(cx, cy - s * 1.0 + bob, s * 0.18, s * 0.2, 0, 0, Math.PI * 2);
  ctx.fill();

  // Hard hat
  ctx.fillStyle = '#F1C40F';
  ctx.beginPath();
  ctx.ellipse(cx, cy - s * 1.12 + bob, s * 0.22, s * 0.13, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(cx - s * 0.22, cy - s * 1.12 + bob, s * 0.44, s * 0.06);

  ctx.restore();
}

// DRILLING RIG
function drawRig(gx, gy) {
  const p = iso(gx, gy);
  const cx = p.x;
  const cy = p.y;
  const h = tW * 2.5;
  const w = tW * 0.6;

  // Base
  ctx.fillStyle = C.rigDark;
  ctx.fillRect(cx - w * 0.8, cy - tH * 0.4, w * 1.6, tH * 0.5);

  // Tracks
  ctx.fillStyle = '#111';
  ctx.fillRect(cx - w * 0.9, cy - tH * 0.2, w * 0.35, tH * 0.3);
  ctx.fillRect(cx + w * 0.55, cy - tH * 0.2, w * 0.35, tH * 0.3);

  // Tower legs
  ctx.strokeStyle = C.rigMid;
  ctx.lineWidth = tW * 0.06;
  ctx.beginPath();
  ctx.moveTo(cx - w * 0.3, cy - tH * 0.1);
  ctx.lineTo(cx - w * 0.1, cy - h);
  ctx.moveTo(cx + w * 0.3, cy - tH * 0.1);
  ctx.lineTo(cx + w * 0.1, cy - h);
  ctx.stroke();

  // Tower cross members
  ctx.lineWidth = tW * 0.04;
  for (let i = 0.2; i < 1.0; i += 0.2) {
    ctx.beginPath();
    ctx.moveTo(cx - w * 0.3 * (1 - i), cy - h * i);
    ctx.lineTo(cx + w * 0.3 * (1 - i), cy - h * i);
    ctx.stroke();
  }

  // Top crown
  ctx.fillStyle = C.rigLight;
  ctx.fillRect(cx - w * 0.12, cy - h - tH * 0.3, w * 0.24, tH * 0.3);

  // DRILLCO orange stripe
  ctx.fillStyle = C.drillcoPrimary;
  ctx.fillRect(cx - w * 0.35, cy - tH * 0.35, w * 0.7, tH * 0.08);

  // Drill pipe (animated)
  const pipeAnim = (Date.now() % 1000) / 1000;
  ctx.strokeStyle = '#95A5A6';
  ctx.lineWidth = tW * 0.06;
  ctx.beginPath();
  ctx.moveTo(cx, cy - h * 0.1);
  ctx.lineTo(cx, cy + tH * 0.8 + Math.sin(pipeAnim * Math.PI * 2) * 3);
  ctx.stroke();

  // Sparks
  if (Math.random() < 0.3) {
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(
        cx + (Math.random() - 0.5) * tW * 0.3,
        cy + tH * 0.7 + Math.random() * tH * 0.3,
        1, 0, Math.PI * 2
      );
      ctx.fillStyle = Math.random() < 0.5 ? '#FFD700' : '#FF6B00';
      ctx.fill();
    }
  }
}

// MOUNTAINS BG
function drawMountains() {
  const grad = ctx.createLinearGradient(0, 0, 0, H * 0.55);
  grad.addColorStop(0, '#0D1F3C');
  grad.addColorStop(0.5, '#1B3A6B');
  grad.addColorStop(1, '#2A5F8A');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H * 0.55);

  // Mountain silhouettes
  const mountains = [
    [0, H*0.5], [W*0.1, H*0.28], [W*0.2, H*0.38], [W*0.3, H*0.22],
    [W*0.45, H*0.32], [W*0.6, H*0.18], [W*0.75, H*0.3], [W*0.85, H*0.2],
    [W, H*0.35], [W, H*0.5]
  ];
  ctx.beginPath();
  ctx.moveTo(0, H*0.5);
  mountains.forEach(([mx, my]) => ctx.lineTo(mx, my));
  ctx.closePath();
  ctx.fillStyle = '#142040';
  ctx.fill();

  // Second layer
  const m2 = [
    [0,H*0.5],[W*0.05,H*0.38],[W*0.15,H*0.45],[W*0.28,H*0.33],
    [W*0.4,H*0.42],[W*0.55,H*0.3],[W*0.7,H*0.4],[W*0.82,H*0.35],
    [W*0.95,H*0.45],[W,H*0.5]
  ];
  ctx.beginPath();
  ctx.moveTo(0,H*0.5);
  m2.forEach(([mx,my])=>ctx.lineTo(mx,my));
  ctx.closePath();
  ctx.fillStyle = '#1A2E50';
  ctx.fill();
}

// SAFETY CONE
function drawCone(gx, gy) {
  const p = iso(gx, gy);
  const s = tW * 0.25;
  ctx.fillStyle = '#FF6B00';
  ctx.beginPath();
  ctx.moveTo(p.x, p.y - s * 2);
  ctx.lineTo(p.x - s * 0.5, p.y);
  ctx.lineTo(p.x + s * 0.5, p.y);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillRect(p.x - s * 0.5, p.y - s * 0.8, s, s * 0.15);
}

// TREE
function drawTree(gx, gy) {
  const p = iso(gx, gy);
  ctx.fillStyle = '#5A3A1A';
  ctx.fillRect(p.x - 2, p.y - tH, 4, tH);
  ctx.beginPath();
  ctx.arc(p.x, p.y - tH - tH*0.8, tH*0.7, 0, Math.PI*2);
  ctx.fillStyle = '#2D6A35';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(p.x, p.y - tH - tH*1.3, tH*0.5, 0, Math.PI*2);
  ctx.fillStyle = '#3A7D44';
  ctx.fill();
}

// SIGN
function drawSign(gx, gy, text) {
  const p = iso(gx, gy);
  ctx.fillStyle = '#8B6914';
  ctx.fillRect(p.x - 1, p.y - tH * 1.5, 2, tH * 1.5);
  ctx.fillStyle = '#F5DEB3';
  ctx.fillRect(p.x - tW * 0.4, p.y - tH * 1.6, tW * 0.8, tH * 0.5);
  ctx.fillStyle = '#2C1810';
  ctx.font = `bold ${tW * 0.18}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(text, p.x, p.y - tH * 1.3);
}

// LABEL FLOAT
function drawLabel(gx, gy, txt, color) {
  const p = iso(gx, gy);
  ctx.save();
  ctx.fillStyle = 'rgba(10,14,26,0.85)';
  const w = txt.length * 7 + 16;
  roundRect(ctx, p.x - w/2, p.y - tH * 3.2, w, 20, 5);
  ctx.fill();
  ctx.fillStyle = color || '#FFD700';
  ctx.font = `bold ${tW * 0.2}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(txt, p.x, p.y - tH * 2.7);
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

let frame = 0;

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Sky
  drawMountains();

  // Ground gradient fade
  const ggrad = ctx.createLinearGradient(0, H*0.4, 0, H);
  ggrad.addColorStop(0, '#2A5F8A');
  ggrad.addColorStop(0.15, '#B8956A');
  ggrad.addColorStop(1, '#8B6640');
  ctx.fillStyle = ggrad;
  ctx.fillRect(0, H*0.4, W, H*0.6);

  // ISO GROUND TILES - draw back to front
  const GRID = 9;
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const isPath = (x === 4) || (y === 4) || (x === 2 && y >= 3) || (y === 2 && x <= 4);
      const col = isPath ? C.path : (Math.random() < 0.001 ? C.grass : C.ground2);
      drawTile(x, y, col, col, col);
    }
  }

  // TALLER — Workshop (brown, left side)
  drawBox(1, 1, 0, 2, 2, 1.5, C.buildBrownTop, C.buildBrown, C.buildBrownDark);
  drawLabel(2, 2, 'TALLER', '#E67E22');

  // BODEGA — Warehouse (blue, back left)
  drawBox(1, 5, 0, 2, 1.5, 1.2, C.buildBlueTop, C.buildBlue, C.buildBlueDark);
  drawLabel(2, 5.7, 'BODEGA', '#5DADE2');

  // OFICINA — Office (green container, center-back)
  drawBox(4, 1, 0, 3, 2, 1.8, C.buildGreenTop, C.buildGreen, C.buildGreenDark);
  drawLabel(5.5, 2, 'OFICINA', '#52B788');

  // FRENTE PERFORACIÓN — Rig area (gray platform)
  drawBox(6, 5, 0, 2.5, 2.5, 0.3, '#9BA5A8', '#7A8588', '#6A7578');

  // Safety cones around rig
  drawCone(6.2, 5.2);
  drawCone(8.2, 5.2);
  drawCone(6.2, 7.2);
  drawCone(8.2, 7.2);

  // Signs
  drawSign(3.5, 0.5, 'DRILLCO');
  drawSign(5.5, 7.5, 'SEGURIDAD');

  // Trees
  drawTree(0.5, 2);
  drawTree(0.3, 6.5);
  drawTree(8.5, 1);
  drawTree(8.7, 2.5);

  // DRILLING RIG
  drawRig(7.2, 6.5);

  // CHARACTER - moving slowly
  charGX += (charTargetX - charGX) * 0.02;
  charGY += (charTargetY - charGY) * 0.02;
  const dist = Math.hypot(charTargetX - charGX, charTargetY - charGY);
  if (dist < 0.05) {
    // New target
    const targets = [[4.5,4.5],[5.5,2.2],[2,2],[7,6],[4.5,7]];
    const t = targets[Math.floor(Math.random() * targets.length)];
    charTargetX = t[0]; charTargetY = t[1];
  }
  if (dist > 0.05) charAnim += 1;
  drawCharacter(charGX, charGY, charAnim);

  frame++;
  requestAnimationFrame(draw);
}

// Tooltip interaction
const fab = document.getElementById('action-btn');
const tip = document.getElementById('tooltip');
fab.addEventListener('click', () => {
  tip.classList.toggle('show');
  setTimeout(() => tip.classList.remove('show'), 2000);
});

// Nav interactions
document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
  });
});

draw();
</script>
